[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textvision-ai"
version = "1.0.0"
description = "TextVision AI — Intelligent text recognition and extraction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
    "onnxruntime>=1.17.0",
    "rapidocr-onnxruntime>=1.3.0",
    "pydantic>=2.6.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pypdf>=4.1.0",
    "pdf2image>=1.17.0",
    "reportlab>=4.1.0",
    "pillow>=10.2.0",
    "shapely>=2.0.0",
    "pyclipper>=1.3.0",
    "requests>=2.31.0",
]

[project.scripts]
textvision = "source.cli.main:app"
cpu-ocr = "source.cli.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
